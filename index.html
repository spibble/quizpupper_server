<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizPupper | CSE 29 Spring 2026</title>
  <link rel="stylesheet" href="assets/css/just-the-docs-default.css">
  <style>
    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color, #eeebee);
    }

    .site-header img {
      height: 48px;
      width: auto;
      flex-shrink: 0;
    }

    .status-row {
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-color, #5c5962);
    }

    .status-row input[type="text"] {
      font-family: monospace;
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border-color, #eeebee);
      border-radius: 4px;
      background: var(--sidebar-bg, #f5f6fa);
      color: var(--text-color, #5c5962);
    }

    .status-row button {
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      border: 1px solid var(--border-color, #eeebee);
      border-radius: 4px;
      cursor: pointer;
    }

    #status {
      font-weight: 600;
    }

    .quiz-controls {
      margin: 1.5rem 0;
    }

    .quiz-controls button {
      font-size: 1rem;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-weight: 600;
    }

    #quiz-area { display: none; }

	#reset-btn  { display: none; }
    #stop-btn  { display: none; }

    #question {
      font-size: 2rem;
      margin: 2rem 0 1.5rem;
      color: var(--text-color, #27262b);
      min-height: 2rem;
      text-align: center;
    }

    #answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .answer-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #333;
      text-align: center;
      padding: 1rem;
    }

    .answer-box.yellow { background-color: #eeff00; }
    .answer-box.orange { background-color: #ffa136; }
    .answer-box.pink   { background-color: #ff34cc; }
    .answer-box.green  { background-color: #45ff38; }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="https://cse29.site">
      <img src="assets/cse29.png" alt="CSE 29 Logo" />
    </a>
  </header>

  <h1>QuizPupper</h1>

  <div class="status-row">
    <span>IP:</span>
    <input id="ip-input" type="text" value="137.110.215.129:9090" size="28" />
    <button class="btn-blue" onclick="reconnect();">Connect</button><br>
    <span>Connection: <span id="status">N/A</span></span><br>
  </div>

  <hr />

  <div class="quiz-controls">
    <button id='start-btn' class="btn-blue" onclick="startQuiz();">Start quizzing!</button>
	<button id='reset-btn' class="btn-blue" onclick="publish('reset');">Reset question</button>
    <button id='stop-btn' class="btn"  onclick="stopQuiz();">Stop quizzing!</button>
  </div>

  <div id="quiz-area">
    <p id="question"></p>
    <div id="answers"></div>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <script type="text/javascript">
    let ros = new ROSLIB.Ros({ url: 'ws://' + document.getElementById('ip-input').value });

    let question_listener;
    let response_publisher;
    let messageCount = 0;

    function handleMessage(message) {
      console.log("received:", message.data, "count:", messageCount);
      if (messageCount % 5 === 0) {
        document.getElementById('question').innerHTML = message.data;
        document.getElementById('answers').innerHTML = '';
      } else {
        const colonIdx = message.data.indexOf(':');
        const color = message.data.substring(0, colonIdx).trim().toLowerCase();
        const text = message.data.substring(colonIdx + 1).trim();

        const box = document.createElement('div');
        box.className = `answer-box ${color}`;
        box.textContent = text;
        document.getElementById('answers').appendChild(box);
      }
      messageCount++;
    }

    function setupTopics() {
      question_listener = new ROSLIB.Topic({
        ros,
        name: '/quiz_question',
        messageType: 'std_msgs/String',
      });

      response_publisher = new ROSLIB.Topic({
        ros,
        name: '/quiz_response',
        messageType: 'std_msgs/String',
      });

      question_listener.subscribe(handleMessage);
    }

    function publish(text) {
      if (!response_publisher) return;
      response_publisher.publish(new ROSLIB.Message({ data: text }));
    }

    function startQuiz() {
      publish('start');
      messageCount = 0;
      document.getElementById('question').innerHTML = 'Waiting for question...';
      document.getElementById('answers').innerHTML = '';
      document.getElementById('quiz-area').style.display = 'block';
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('reset-btn').style.display = 'inline-block';
	  document.getElementById('stop-btn').style.display = 'inline-block';
    }

    function stopQuiz() {
      publish('stop');
      document.getElementById('quiz-area').style.display = 'none';
	  document.getElementById('reset-btn').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('start-btn').style.display = 'inline-block';
    }

    ros.on('connection', () => {
      document.getElementById('status').innerHTML = 'connected';
      setupTopics();
    });
    ros.on('error', (error) => { document.getElementById('status').innerHTML = `error (${error})`; });
    ros.on('close', () => { document.getElementById('status').innerHTML = 'closed'; });

    function reconnect() {
      ros.socket.close();
      ros = new ROSLIB.Ros({ url: 'ws://' + document.getElementById('ip-input').value });
      ros.on('connection', () => {
        document.getElementById('status').innerHTML = 'connected';
        setupTopics();
      });
      ros.on('error', (error) => { document.getElementById('status').innerHTML = `error (${error})`; });
      ros.on('close', () => { document.getElementById('status').innerHTML = 'closed'; });
    }
  </script>

</body>
</html>
